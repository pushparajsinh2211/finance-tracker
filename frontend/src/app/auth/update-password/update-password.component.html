<div class="auth-wrapper animate-fade-in">
  <div class="glass-panel auth-panel">
    <div class="auth-header">
      <div class="logo">FinanceHub</div>
      <h2>Choose a New Password</h2>
      <p *ngIf="isPreparing">Checking your secure reset link…</p>
      <p *ngIf="!isPreparing && recoveryReady">Enter a new password for your account.</p>
    </div>

    <div class="alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form *ngIf="recoveryReady" [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" formControlName="password" autocomplete="new-password">
        <div class="text-danger"
          *ngIf="passwordForm.get('password')?.touched && passwordForm.get('password')?.invalid">
          Use at least 6 characters.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" class="form-control" formControlName="confirmPassword" autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block"
        [disabled]="passwordForm.invalid || isLoading">
        <span *ngIf="!isLoading">Update Password</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer" *ngIf="!isPreparing && !recoveryReady">
      <a routerLink="/forgot-password">Request a new reset link</a>
    </div>
  </div>
</div>
