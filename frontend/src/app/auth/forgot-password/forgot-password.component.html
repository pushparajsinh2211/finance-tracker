<div class="auth-wrapper animate-fade-in">
    <div class="glass-panel auth-panel">
        <div class="auth-header">
            <div class="logo">FamilyLedger</div>
            <h2>Reset Password</h2>
            <p>Enter your email to receive a reset link.</p>
        </div>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" formControlName="email">
            </div>

            <div [class]="isError ? 'alert-error' : 'alert-success'" *ngIf="message"
                style="padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.875rem;"
                [style.color]="isError ? '#F43F5E' : '#10B981'"
                [style.backgroundColor]="isError ? 'rgba(244, 63, 94, 0.1)' : 'rgba(16, 185, 129, 0.1)'">
                {{ message }}
            </div>

            <button type="submit" class="btn btn-primary btn-block" [disabled]="forgotForm.invalid || isLoading">
                <span *ngIf="!isLoading">Send Reset Link</span>
                <span *ngIf="isLoading" class="spinner"></span>
            </button>
        </form>

        <div class="auth-footer">
            Remember your password? <a routerLink="/login">Log in</a>
        </div>
    </div>
</div>
