<header class="app-header">
  <div class="nav-shell container">
    <a routerLink="/dashboard" class="brand" aria-label="FinanceHub home">
      <span class="brand-mark" aria-hidden="true">F</span>
      <span class="brand-copy">
        <strong>FinanceHub</strong>
        <small>Family finance</small>
      </span>
    </a>

    <nav class="primary-nav" aria-label="Primary navigation">
      <a routerLink="/dashboard" routerLinkActive="active-link">
        <span>Expenses</span>
      </a>
      <a routerLink="/transactions" routerLinkActive="active-link">
        <span>Transactions</span>
      </a>
      <a routerLink="/connections" routerLinkActive="active-link">
        <span>Data sources</span>
      </a>
      <a routerLink="/budgets" routerLinkActive="active-link">
        <span>Budgets</span>
      </a>
      <a routerLink="/finance" routerLinkActive="active-link">
        <span>Goals & loans</span>
      </a>
      <a routerLink="/family" routerLinkActive="active-link">
        <span>Family</span>
      </a>
      <a routerLink="/privacy" routerLinkActive="active-link">
        <span>Privacy</span>
      </a>
    </nav>

    <div class="nav-actions">
      <div class="notification-menu">
        <button
          type="button"
          class="icon-button"
          (click)="toggleDropdown()"
          [attr.aria-expanded]="showDropdown"
          aria-haspopup="true"
          aria-label="Open notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
          </svg>
          <span *ngIf="unreadCount > 0" class="notification-badge">{{ unreadCount }}</span>
        </button>

        <section *ngIf="showDropdown" class="notification-panel" aria-label="Notifications">
          <div class="notification-header">
            <div>
              <span class="eyebrow">Activity</span>
              <h2>Notifications</h2>
            </div>
            <button *ngIf="unreadCount > 0" type="button" class="text-button" (click)="markAllAsRead()">
              Mark all read
            </button>
          </div>

          <div *ngIf="notifications.length === 0" class="notification-empty">
            <span class="empty-icon" aria-hidden="true">✓</span>
            <strong>You are all caught up</strong>
            <small>New family activity will appear here.</small>
          </div>

          <div class="notification-list" *ngIf="notifications.length > 0">
            <article *ngFor="let n of notifications" class="notification-item" [class.is-read]="n.isRead">
              <span class="unread-dot" *ngIf="!n.isRead" aria-hidden="true"></span>
              <div>
                <time>{{ n.createdAt | date:'mediumDate' }}</time>
                <p>{{ n.message }}</p>
                <button *ngIf="!n.isRead" type="button" class="text-button" (click)="markAsRead(n.id)">
                  Mark read
                </button>
              </div>
            </article>
          </div>
        </section>
      </div>

      <button type="button" class="sign-out-button" (click)="logout()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        </svg>
        <span>Sign out</span>
      </button>
    </div>
  </div>
</header>
