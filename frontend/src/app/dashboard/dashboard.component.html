<div class="dashboard-wrapper">
    <app-top-nav></app-top-nav>

    <main class="dashboard-content">
        <header class="page-header"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2rem;">Transactions</h1>
            <button class="btn btn-primary" (click)="openAddForm()">+ Add Expense</button>
        </header>

        <div class="filters-bar glass-panel"
            style="padding: 1rem; margin-bottom: 2rem; display: flex; gap: 1rem; border-radius: var(--radius-md);">
            <div class="form-group" style="margin-bottom: 0; flex: 1;">
                <label class="form-label" style="font-size: 0.8rem;">Month</label>
                <input type="month" class="form-control" [(ngModel)]="selectedMonth" (change)="onFilterChange()">
            </div>
            <div class="form-group" style="margin-bottom: 0; flex: 1;">
                <label class="form-label" style="font-size: 0.8rem;">Category</label>
                <select class="form-control" [(ngModel)]="selectedCategoryId" (change)="onFilterChange()">
                    <option value="">All Categories</option>
                    <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
                </select>
            </div>
        </div>

        <div class="glass-panel" style="border-radius: var(--radius-md); overflow: hidden;">
            <div *ngIf="isLoading" style="padding: 3rem; text-align: center;">
                <span class="spinner" style="border-top-color: var(--primary);"></span>
            </div>

            <div *ngIf="!isLoading && expenses.length === 0"
                style="padding: 3rem; text-align: center; color: var(--text-muted);">
                <p>No expenses found for this period.</p>
                <button class="btn btn-secondary" style="margin-top: 1rem;" (click)="openAddForm()">Log your first
                    expense</button>
            </div>

            <table class="expense-table" *ngIf="!isLoading && expenses.length > 0">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Note</th>
                        <th style="text-align: right;">Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let exp of expenses" (click)="openEditForm(exp)" style="cursor: pointer;">
                        <td style="color: var(--text-muted);">{{ exp.date | date:'mediumDate' }}</td>
                        <td>
                            <span class="category-badge"
                                [style.backgroundColor]="getCategoryColor(exp.categoryId) + '33'"
                                [style.color]="getCategoryColor(exp.categoryId)">
                                {{ getCategoryName(exp.categoryId) }}
                            </span>
                        </td>
                        <td>{{ exp.note || '-' }} <span *ngIf="exp.isRecurring"
                                style="margin-left: 0.5rem; font-size: 0.75rem; color: var(--secondary);">↺</span></td>
                        <td style="text-align: right; font-weight: 600; color: #fff;">₹{{ exp.amount | number:'1.2-2' }}
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal Overlay for Expense Form -->
<div class="modal-overlay animate-fade-in" *ngIf="showExpenseForm">
    <div class="modal-container">
        <app-expense-form [initialExpense]="selectedExpense" (formSaved)="onFormSaved($event)"
            (formCancelled)="onFormCancelled()">
        </app-expense-form>
    </div>
</div>
