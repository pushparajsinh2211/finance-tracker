name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/FamilyLedger.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ../FamilyLedger.Api.Tests/FamilyLedger.Api.Tests.csproj
      - run: dotnet build --configuration Release --no-restore
      - name: Run backend unit and controlled chaos tests
        run: dotnet test ../FamilyLedger.Api.Tests/FamilyLedger.Api.Tests.csproj --configuration Release --no-restore
      - name: Validate API container OCR dependencies
        run: |
          docker build --tag financehub-api-ci .
          docker run --rm --entrypoint sh financehub-api-ci -c \
            'pdftoppm -v >/dev/null 2>&1 && tesseract --version >/dev/null 2>&1'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false --browsers=ChromeHeadless

  e2e:
    name: Playwright acceptance tests
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    name: Supabase migration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable Supabase stack and apply migrations
        run: supabase start
      - name: Rebuild database from the complete migration chain
        run: supabase db reset --local
      - name: Run family authorization policy tests
        run: supabase test db
