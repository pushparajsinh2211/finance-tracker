name: Deploy Supabase production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to apply pending migrations to production
        required: true
        type: string
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ojyqclewkgbrhuaehsvb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          }
          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "::error::SUPABASE_DB_PASSWORD is not configured."
            exit 1
          }

      - name: Link production project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        shell: bash
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply pending migrations
        shell: bash
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
